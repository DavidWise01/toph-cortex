name: TOPH Clear-View Recursive Audit

on:
  push:
    branches: [main]
    paths:
      - "bin/clear_view.py"
      - "bin/test_clear_view.py"
      - "bin/test_clear_view_exhaustive_v2.py"
      - "bin/test_clear_view_exhaustive_v2.py"
      - "memory/semantic/clear-view-rule-v1.md"
      - "bin/cortex.py"
      - ".github/workflows/clear-view-v1.yml"
  pull_request:
    paths:
      - "bin/clear_view.py"
      - "bin/test_clear_view.py"
      - "memory/semantic/clear-view-rule-v1.md"
      - "bin/cortex.py"
      - ".github/workflows/clear-view-v1.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recursive clear-view selftest
        run: python bin/clear_view.py --selftest
      - name: Recursive stress audit
        run: python bin/test_clear_view.py
      - name: Bounded exhaustive adversarial audit
        run: python bin/test_clear_view_exhaustive_v2.py
      - name: Cortex import/dashboard smoke
        run: python bin/cortex.py > /tmp/cortex.txt && grep -q "CLEAR-VIEW" /tmp/cortex.txt
