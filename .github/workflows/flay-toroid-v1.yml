name: FLAY Mandel-Juliet v1

on:
  push:
    paths:
      - "bin/flay_toroid.py"
      - "bin/test_flay_toroid.py"
      - "memory/semantic/flay-mandel-juliet-toroid-v1.md"
      - ".github/workflows/flay-toroid-v1.yml"
  pull_request:
    paths:
      - "bin/flay_toroid.py"
      - "bin/test_flay_toroid.py"
      - "memory/semantic/flay-mandel-juliet-toroid-v1.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run FLAY toroid tests
        run: |
          cd bin
          python test_flay_toroid.py
          python flay_toroid.py
