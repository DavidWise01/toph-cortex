name: ROOT0 Corpus Memory — verify chain

on:
  push:
    branches: [main]
    paths:
      - "memory/corpus-spine/**"
      - "bin/corpus_spine.py"
      - "bin/temporal_diode.py"
      - "tests/test_corpus_spine.py"
      - "tests/test_temporal_diode.py"
      - "bin/witness_identity.py"
      - "bin/delivery_receipt.py"
      - "tests/test_gate09.py"
      - "bin/witness_attestation.py"
      - "bin/append_only_diff.py"
      - "bin/witness_keytool.py"
      - "tests/test_gate10.py"
      - "bin/distributed_checkpoint.py"
      - "tests/test_gate11.py"
      - "bin/key_lifecycle.py"
      - "tests/test_gate12.py"
      - "bin/referent_watermark.py"
      - "tests/test_gate13.py"
      - "memory/corpus-spine/referent-events.jsonl"
      - "memory/corpus-spine/research/**"
      - ".github/workflows/referent-append.yml"
      - "memory/corpus-spine/key-lifecycle.jsonl"
      - ".github/workflows/key-lifecycle-append.yml"
      - "memory/corpus-spine/checkpoints.jsonl"
      - ".github/workflows/checkpoint-append.yml"
      - "memory/corpus-spine/witness-public-keys.json"
      - "memory/corpus-spine/witness-attestations.jsonl"
      - ".github/workflows/corpus-memory-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reject prior Git memory rewrites and key-registry deletion
        run: python3 bin/append_only_diff.py
      - name: Verify append-only corpus chain
        run: python3 bin/corpus_spine.py verify
      - name: Verify temporal diode
        run: python3 bin/temporal_diode.py verify
      - name: Verify delivery ledger (empty genesis is valid)
        run: python3 bin/delivery_receipt.py verify
      - name: Install pinned Ed25519 verifier
        run: python3 -m pip install "cryptography==46.0.4"
      - name: Verify signed witness history
        run: python3 bin/witness_attestation.py verify
      - name: Verify append-only key lifecycle
        run: python3 bin/key_lifecycle.py verify
      - name: Verify independently watermarked referents
        run: python3 bin/referent_watermark.py verify
      - name: Verify signed checkpoint state
        run: python3 bin/distributed_checkpoint.py verify
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -p 'test_corpus_spine.py' -v && python3 -m unittest discover -s tests -p 'test_temporal_diode.py' -v && python3 -m unittest discover -s tests -p 'test_gate09.py' -v && python3 -m unittest discover -s tests -p 'test_gate10.py' -v && python3 -m unittest discover -s tests -p 'test_gate11.py' -v && python3 -m unittest discover -s tests -p 'test_gate12.py' -v && python3 -m unittest discover -s tests -p 'test_gate13.py' -v
